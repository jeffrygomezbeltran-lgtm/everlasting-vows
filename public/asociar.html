<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Prueba guardar tarjeta en Chrome</title>
</head>
<body>

<h3>Formulario de prueba — Guardado de tarjeta en Chrome</h3>

<form>
  <label for="testCardNumber">Número de tarjeta</label><br>
  <input 
      type="text" 
      id="testCardNumber" 
      name="testCardNumber" 
      autocomplete="cc-number" 
      placeholder="0000 0000 0000 0000"
      required
  ><br><br>

  <label>Fecha de vencimiento</label><br>
  <div style="display:flex; gap:10px;">
      <select id="expMonth" name="expMonth" autocomplete="cc-exp-month" required>
          <option value="" disabled selected>Mes</option>
          <option>01</option><option>02</option><option>03</option><option>04</option>
          <option>05</option><option>06</option><option>07</option><option>08</option>
          <option>09</option><option>10</option><option>11</option><option>12</option>
      </select>

      <select id="expYear" name="expYear" autocomplete="cc-exp-year" required>
          <option value="" disabled selected>Año</option>
          <option>2025</option><option>2026</option><option>2027</option>
          <option>2028</option><option>2029</option><option>2030</option>
          <option>2031</option>
          <option>2033</option>
      </select>
  </div>

  <br>
  <button type="submit">Enviar</button>
</form>

</body>
</html>
